if not "X86" in config.root.targets:
    config.unsupported = True

# Unit 17: variant-aware lit features for FlexFat IR tests. Tests that bake
# non-POW2-specific codegen patterns into their CHECK lines (reciprocal
# multiply / 0x300000 magic-table load) REQUIRES: flexfat-nonpow2.
if getattr(config.root, "flexfat_is_pow2", False):
    config.available_features.add("flexfat-pow2")
else:
    config.available_features.add("flexfat-nonpow2")
